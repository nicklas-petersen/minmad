<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe inspiration</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#25211d;background:#f7f3ed}body{max-width:1100px;margin:0 auto;padding:2rem}header{margin-bottom:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{background:#fff;border:1px solid #ded7cc;border-radius:12px;padding:1rem}.card h2{font-size:1.1rem;margin:.2rem 0}.meta{color:#756b62;font-size:.9rem}.card details{margin-top:.8rem}.card summary{cursor:pointer;font-weight:650}.tag{display:inline-block;background:#eee6da;border-radius:999px;padding:.2rem .55rem;margin:.15rem;font-size:.78rem}.source{font-size:.8rem;color:#756b62}.note{background:#fff8e8;border-left:4px solid #d6a64f;padding:.6rem;margin-top:.7rem}
</style>
</head>
<body>
<header>
<h1>Recipe inspiration</h1>
<p>Browse mild, filling meals with metric quantities, clearly prepared vegetables, specified oils, cooking temperatures and adjustable serving sizes.</p>
<p>Click a recipe name to open its detailed metric ingredients and method.</p>
</header>
<main class="grid" id="recipes"></main>
<script>
const recipes=[
{name:'Greek chicken with lemon potatoes',cuisine:'Greek',serves:4,time:'1 h 20 min',tags:['chicken','potatoes'],ingredients:['800 g chicken thighs','1 kg potatoes, peeled and quartered','60 ml olive oil','2 lemons, juice and zest','4 garlic cloves, finely chopped','250 ml chicken stock','2 tsp dried oregano','Salt and black pepper'],method:'Heat the oven to 200°C. Toss the potatoes with half the oil, lemon, garlic, oregano and stock in a roasting dish. Add seasoned chicken and the remaining oil. Roast for 55–65 minutes, turning the potatoes once, until the chicken reaches 75°C internally and the potatoes are tender.',source:'The Mediterranean Dish',url:'https://www.themediterraneandish.com/greek-chicken-and-potato-dinner/',note:'Traditional preparation adapted to metric quantities.'},
{name:'Middle Eastern chicken and rice',cuisine:'Middle Eastern',serves:4,time:'40 min',tags:['chicken','rice'],ingredients:['600 g boneless chicken thighs','300 g long-grain rice','1 onion, finely diced','30 ml olive oil','700 ml chicken stock','2 tsp ground cumin','1 tsp ground coriander','1 tsp paprika','Salt and pepper','20 g toasted almonds'],method:'Season the chicken with the spices. Brown it in the oil in a deep pan, then set aside. Soften the onion, stir in the rinsed rice, add stock and return the chicken. Cover and simmer for 20 minutes, then rest for 10 minutes. Fluff and top with almonds.',source:'The Mediterranean Dish',url:'https://www.themediterraneandish.com/middle-eastern-chicken-and-rice/',note:'Mild version; omit chilli and adjust seasoning to taste.'},
{name:'Danish frikadeller',cuisine:'Danish',serves:4,time:'35 min',tags:['pork','meatballs'],ingredients:['500 g minced pork','1 egg','100 ml milk','60 g plain flour','1 onion, finely grated','1 tsp salt','½ tsp white pepper','20 ml rapeseed oil'],method:'Mix the pork, egg, milk, flour, onion, salt and pepper until smooth. Rest for 10 minutes. Shape into small oval meatballs with a wet spoon. Fry in the oil over medium heat for 4–5 minutes per side until browned and cooked through.',source:'Denmark.dk',url:'https://denmark.dk/people-and-culture/recipes/danish-meat-balls/',note:'Serve with boiled potatoes and a mild vegetable side.'},
{name:'Lemon and caper salmon linguine',cuisine:'Italian-inspired',serves:4,time:'30 min',tags:['salmon','pasta'],ingredients:['320 g linguine','400 g salmon fillet','150 ml single cream','1 lemon, zest and juice','30 g capers, rinsed','15 ml olive oil','2 tbsp chopped parsley'],method:'Cook the linguine until al dente. Pan-cook the salmon in oil until just cooked, then flake. Warm the cream with lemon zest, juice and capers. Toss with the pasta and salmon, adding pasta water if needed. Finish with parsley.',source:'BBC Food',url:'https://www.bbc.co.uk/food/recipes/lemon_and_caper_salmon_94223',note:'Use a dairy-free cream alternative if needed.'},
{name:'Salmon and broccoli pasta',cuisine:'British',serves:2,time:'15 min',tags:['salmon','broccoli','pasta'],ingredients:['160 g pasta','200 g salmon','150 g broccoli florets','100 g crème fraîche','1 lemon, zest and juice','10 ml olive oil','Black pepper'],method:'Cook the pasta. Steam the broccoli for the final 4 minutes. Cook the salmon in oil and flake it. Stir crème fraîche, lemon and pepper through the drained pasta, then fold in salmon and broccoli.',source:'BBC Food',url:'https://www.bbc.co.uk/food/recipes/salmon_broccoli_pasta_39926',note:'Quick meal; double quantities for four servings.'},
{name:'Salmon pasta',cuisine:'British',serves:2,time:'30 min',tags:['salmon','pasta'],ingredients:['180 g pasta','250 g salmon','1 leek, thinly sliced','150 ml crème fraîche','1 lemon','10 ml olive oil','2 tbsp dill'],method:'Cook the pasta. Soften the leek in oil, add salmon and cook gently until opaque. Stir in crème fraîche, lemon zest and juice. Toss with the pasta and dill.',source:'BBC Food',url:'https://www.bbc.co.uk/food/recipes/salmon_pasta_36158',note:'Mild and suitable for a simple weeknight dinner.'},
{name:'Beef ragout with pappardelle',cuisine:'Italian-inspired',serves:6,time:'2 h 30 min',tags:['beef','pasta'],ingredients:['1 kg stewing beef','30 ml olive oil','2 carrots, diced','2 celery sticks, diced','2 garlic cloves, chopped','500 ml beef stock','400 g chopped tomatoes','400 g pappardelle','1 tsp dried thyme'],method:'Brown the beef in the oil in batches. Soften the vegetables and garlic. Return the beef, add stock, tomatoes and thyme, then cover and simmer gently for about 2 hours until tender. Cook the pasta and serve with the ragout.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/beef-ragout',note:'The tomato base is traditional; replace with extra stock if avoiding tomato.'},
{name:'Chicken and couscous one-pot',cuisine:'North African-inspired',serves:4,time:'40 min',tags:['chicken','couscous'],ingredients:['600 g chicken thighs','250 g couscous','1 courgette, diced','1 red pepper, diced','500 ml chicken stock','30 ml olive oil','2 tsp ground cumin','1 tsp paprika'],method:'Brown the chicken in oil. Add the vegetables and spices and cook for 5 minutes. Pour in the stock and simmer until the chicken is cooked. Stir in couscous, cover for 5 minutes, then fluff.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/collection/one-pot-recipes',note:'Use mild paprika and omit chilli.'},
{name:'Jerk pork with rice and beans',cuisine:'Caribbean',serves:4,time:'1 h',tags:['pork','rice'],ingredients:['600 g pork tenderloin','300 g rice','400 g cooked kidney beans','1 onion, sliced','400 ml coconut milk','200 ml water','30 ml oil','2 tsp allspice','1 tsp thyme','1 lime'],method:'Rub pork with allspice and thyme. Brown in oil, then roast at 190°C for 20–25 minutes until 63°C internally and rested. Simmer rice, beans, onion, coconut milk and water until tender. Slice pork and serve with lime.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/collection/caribbean-recipes',note:'Keep it mild by omitting Scotch bonnet chilli.'},
{name:'Sticky jerk salmon with mango slaw',cuisine:'Caribbean-inspired',serves:4,time:'35 min',tags:['salmon'],ingredients:['4 salmon fillets, about 150 g each','30 ml maple syrup','15 ml lime juice','1 tsp allspice','1 mango, sliced','250 g white cabbage, shredded','1 carrot, grated','100 g yoghurt'],method:'Mix maple syrup, lime and allspice and brush over salmon. Bake at 200°C for 12–15 minutes until cooked through. Mix mango, cabbage, carrot and yoghurt for the slaw and serve alongside.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/collection/caribbean-recipes',note:'Mild adaptation without hot pepper.'},
{name:'Creamy salmon, leek and potato traybake',cuisine:'British',serves:4,time:'55 min',tags:['salmon','potatoes'],ingredients:['600 g salmon','800 g potatoes, thinly sliced','2 leeks, sliced','200 ml crème fraîche','150 ml vegetable stock','1 lemon','10 ml olive oil'],method:'Heat the oven to 200°C. Bake potatoes and leeks with oil and stock for 30 minutes. Add salmon and crème fraîche, season with lemon, and bake for another 15–18 minutes until the salmon flakes.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/collection/oven-baked-dinners',note:'A complete one-dish meal.'},
{name:'Danish chicken salad with mushrooms and bacon',cuisine:'Danish',serves:4,time:'35 min',tags:['chicken','salad'],ingredients:['500 g chicken breast','150 g mushrooms, sliced','100 g bacon, diced','150 g mayonnaise','100 g crème fraîche','1 tbsp lemon juice','1 tbsp chopped parsley','4 slices rye bread'],method:'Poach or bake the chicken until 75°C internally and cool. Fry bacon until crisp, add mushrooms and cook until tender. Dice the chicken and mix with mayonnaise, crème fraîche, lemon and parsley. Serve on rye bread.',source:'Denmark.dk',url:'https://denmark.dk/people-and-culture/recipes/chicken-salad/',note:'Serve chilled as an open sandwich.'},
{name:'Danish wheat buns',cuisine:'Danish',serves:10,time:'2 h 30 min',tags:['bread'],ingredients:['500 g strong white flour','300 ml lukewarm milk','25 g fresh yeast or 7 g dried yeast','50 g butter, melted','1 egg','25 g sugar','1 tsp salt'],method:'Mix yeast with milk, then add flour, butter, egg, sugar and salt. Knead until elastic. Cover and rise for 1 hour. Shape 10 buns, place close together and rise for 30 minutes. Bake at 200°C for 15–18 minutes.',source:'Denmark.dk',url:'https://denmark.dk/people-and-culture/recipes/danish-wheat-buns/',note:'Makes 10–12 buns in the source recipe.'},
{name:'Danish layer cake',cuisine:'Danish',serves:12,time:'2 h',tags:['cake'],ingredients:['3 eggs','170 g sugar','120 g plain flour','1 tsp baking powder','250 ml milk','1 vanilla pod or 2 tsp vanilla','30 g cornflour','250 ml whipping cream','200 g berries'],method:'Bake two or three thin sponge layers from eggs, sugar, flour and baking powder at 180°C until springy. Make custard with milk, vanilla and cornflour. Cool everything. Layer sponge, custard, whipped cream and berries, then chill before serving.',source:'Denmark.dk',url:'https://denmark.dk/people-and-culture/recipes/layer-cake/',note:'Traditional celebration cake; quantities are metric.'},
{name:'One-pan Spanish chicken and rice',cuisine:'Spanish',serves:4,time:'55 min',tags:['chicken','rice'],ingredients:['600 g chicken thighs','300 g rice','1 onion, diced','1 red pepper, diced','100 g chorizo, sliced','750 ml chicken stock','30 ml olive oil','1 tsp smoked paprika','1 lemon'],method:'Brown chicken and chorizo in oil. Add onion, pepper and paprika and cook until softened. Stir in rice and stock, return chicken, cover and simmer or bake at 190°C for 25–30 minutes. Rest for 10 minutes and finish with lemon.',source:'The Mediterranean Dish',url:'https://www.themediterraneandish.com/spanish-chicken-rice-recipe-chorizo/',note:'Omit chorizo and use extra chicken if preferred.'},
{name:'Maqluba',cuisine:'Middle Eastern',serves:6,time:'1 h 30 min',tags:['rice','chicken'],ingredients:['600 g chicken thighs','350 g rice','1 aubergine, sliced','2 carrots, sliced','1 onion, sliced','750 ml stock','30 ml olive oil','2 tsp mixed spice','30 g toasted almonds'],method:'Season and brown the chicken. Fry or roast the aubergine and carrots. Layer chicken, vegetables and rinsed rice in a deep pot. Add stock, cover and cook gently until rice is tender. Rest, invert onto a platter and top with almonds.',source:'The Mediterranean Dish',url:'https://www.themediterraneandish.com/maqluba-recipe/',note:'Aubergine is traditional; courgette can be used as an alternative.'},
{name:'Salsa verde roast chicken',cuisine:'British-inspired',serves:4,time:'1 h 20 min',tags:['chicken'],ingredients:['1 whole chicken, about 1.5 kg','30 ml olive oil','1 lemon','Salt and pepper','30 g parsley','15 g tarragon','1 tbsp capers','1 garlic clove','60 ml olive oil'],method:'Heat the oven to 200°C. Rub chicken with oil, lemon, salt and pepper. Roast for about 1 hour 15 minutes until the thickest part reaches 75°C. Blend herbs, capers, garlic and oil into salsa verde and serve with the rested chicken.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/salsa-verde',note:'Serve sauce separately for a milder plate.'},
{name:'Smoky beef and black bean stew',cuisine:'North American-inspired',serves:6,time:'1 h 15 min',tags:['beef','beans'],ingredients:['750 g minced beef','1 onion, diced','2 garlic cloves','400 g black beans, drained','400 g chopped tomatoes','500 ml beef stock','2 tsp smoked paprika','1 tsp cumin'],method:'Brown the beef. Add onion and garlic and cook until soft. Stir in beans, tomatoes, stock and spices. Simmer uncovered for 35–45 minutes until thickened. Serve with bread or rice.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes',note:'Use extra stock and omit chilli for a mild version.'},
{name:'Chicken pasta bake',cuisine:'European-inspired',serves:4,time:'1 h 15 min',tags:['chicken','pasta'],ingredients:['400 g pasta','500 g chicken breast, diced','1 onion, diced','400 g chopped tomatoes','150 ml crème fraîche','150 g grated cheese','15 ml olive oil'],method:'Heat the oven to 190°C. Cook pasta until just tender. Fry chicken in oil until nearly cooked, add onion and tomatoes and simmer. Combine with pasta and crème fraîche, top with cheese and bake for 25 minutes.',source:'BBC Good Food',url:'https://www.bbcgoodfood.com/recipes/collection/chicken-pasta-recipes',note:'Replace tomato sauce with a mild cream sauce if required.'},
{name:'Greek lemon chicken soup',cuisine:'Greek-inspired',serves:4,time:'45 min',tags:['chicken','soup'],ingredients:['400 g chicken breast','1.2 l chicken stock','100 g rice','2 eggs','2 lemons','1 carrot, diced','1 celery stick, diced'],method:'Simmer chicken, stock, carrot, celery and rice until cooked. Remove and shred the chicken. Whisk eggs with lemon juice, then gradually whisk in hot broth. Return mixture to the pan over low heat without boiling, add chicken and serve.',source:'Traditional adaptation',url:'https://www.themediterraneandish.com/',note:'Do not boil after adding egg to keep the soup smooth.'},
{name:'Herb-roasted cod with potatoes',cuisine:'European-inspired',serves:4,time:'50 min',tags:['cod','potatoes'],ingredients:['600 g cod fillets','800 g potatoes, halved','30 ml olive oil','1 lemon','2 garlic cloves','2 tbsp chopped parsley','150 ml stock'],method:'Heat the oven to 200°C. Roast potatoes with oil, garlic and stock for 30 minutes. Add cod, lemon and parsley and roast for 12–15 minutes until the fish flakes easily.',source:'Traditional adaptation',url:'https://www.bbcgoodfood.com/recipes/collection/oven-baked-dinners',note:'Use any firm white fish.'},
{name:'Creamy mushroom chicken',cuisine:'European-inspired',serves:4,time:'40 min',tags:['chicken','mushrooms'],ingredients:['600 g chicken breast','300 g mushrooms, sliced','1 onion, sliced','200 ml chicken stock','150 ml crème fraîche','15 ml rapeseed oil','1 tsp dried thyme'],method:'Brown chicken in oil and set aside. Cook onion and mushrooms until softened. Add stock and thyme, return chicken and simmer until cooked through. Stir in crème fraîche just before serving.',source:'Traditional adaptation',url:'https://www.bbcgoodfood.com/recipes',note:'Serve with rice, potatoes or bread.'},
{name:'Apple and cinnamon crumble',cuisine:'British',serves:6,time:'55 min',tags:['dessert','apple'],ingredients:['800 g apples, peeled, cored and sliced','50 g sugar','1 tsp cinnamon','150 g plain flour','100 g rolled oats','100 g cold butter','80 g brown sugar'],method:'Heat the oven to 180°C. Toss apples with sugar and cinnamon in a baking dish. Rub butter into flour, stir in oats and sugar, and scatter over apples. Bake for 35–40 minutes until bubbling and golden.',source:'Traditional adaptation',url:'https://www.bbcgoodfood.com/recipes',note:'Serve with yoghurt, custard or cream.'},
{name:'Nordic salmon and potato cakes',cuisine:'Nordic-inspired',serves:4,time:'50 min',tags:['salmon','potatoes'],ingredients:['400 g cooked potatoes','300 g cooked salmon','1 egg','2 tbsp flour','2 tbsp chopped dill','1 lemon','20 ml rapeseed oil'],method:'Mash potatoes and flake salmon. Mix with egg, flour, dill and lemon zest. Shape into eight cakes and chill for 15 minutes. Fry in oil for 4–5 minutes per side until golden and hot through.',source:'Traditional adaptation',url:'https://denmark.dk/people-and-culture/recipes/',note:'A useful way to use leftover cooked fish and potatoes.'}
];
const root=document.getElementById('recipes');
root.innerHTML=recipes.map((r,i)=>`<article class="card"><h2>${i+1}. ${r.name}</h2><div class="meta">${r.cuisine} · Serves ${r.serves} · ${r.time}</div><div>${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><details><summary>Ingredients and method</summary><h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Method</h3><p>${r.method}</p><p class="source">Source: <a href="${r.url}" target="_blank" rel="noopener">${r.source}</a></p><p class="note">${r.note}</p></details></article>`).join('');
</script>
</body>
</html>
